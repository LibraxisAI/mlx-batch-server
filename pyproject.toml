[project]
name = "mlx-batch-server"
version = "0.6.0-dev"
description = "Local OpenAI-compatible Responses inference owner for Apple Silicon: fused Qwen Flash, signed 8100-8102 roles, honest row-serial MTP."
authors = [
    { name = "Vetcoders", email = "hello@vetcoders.io" },
]
maintainers = [
    { name = "Maciej Gad", email = "void@div0.space" },
]
# Original project by madroid (madroidmaq@gmail.com) - https://github.com/madroidmaq/mlx-omni-server
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSES/Apache-2.0.txt",
]
keywords = [
    "mlx",
    "ai",
    "agi",
    "aigc",
    "server",
    "openai",
    "tts",
    "stt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # core
    "fastapi>=0.116.1",
    "pydantic>=2.9.2,<3",
    "pydantic-settings>=2.0",
    "uvicorn>=0.34.0,<0.35",
    "rich>=13.9.4",
    # chat
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "transformers==5.14.1",
    "nanobind==2.15.0",
    "python-multipart>=0.0.20,<0.0.21",
    "sse-starlette>=2.1.3,<3",
    "httpx>=0.27.2,<0.28",
    "outlines==1.0.4",
    # models
    "huggingface-hub>=0.30",
    # audio
    "f5-tts-mlx>=0.2.5,<0.3",
    "mlx-whisper>=0.4.1",
    "mlx-audio>=0.2.4",
    "numba>=0.57.0",
    # images
    # The pinned upstream-compatible revision supports MLX 0.32 while retaining
    # the native MFLUX checkpoint loader used by existing local model caches.
    "mflux==0.18.0",
    # embeddings
    "mlx-embeddings>=0.0.3",
    "openai-harmony>=0.0.8",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "mlx-vlm",
    "pymupdf>=1.24,<2",
]

[project.urls]
Repository = "https://github.com/LibraxisAI/mlx-batch-server"

[project.scripts]
mlx-batch-server = "mlx_batch_server.main:start"
mlx-batch-operator = "mlx_batch_server.operator.cli:main"

[project.optional-dependencies]
operator = [
    "click>=8",
    "jinja2>=3",
    "python-multipart",
    "ruamel.yaml",
]
auth = [
    "redis>=5.0",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27.2,<0.28",
    "gradio>=5.0.0", # playground API tester
    "pre-commit>=4.0.1,<5",
    "weave>=0.51.46,<0.60",
    "chardet>=5,<6", # keep requests compatibility when weave pulls chardet
    "openai>=1.97.0",
    "anthropic>=0.57.1",
    # linting & formatting (LibraxisAI)
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.7.0",
    # for en_core_web_sm models
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlx_batch_server",
    "LICENSE",
    "NOTICE",
    "LICENSES/Apache-2.0.txt",
]

[tool.hatch.build.targets.wheel]
include = ["src/mlx_batch_server"]

[tool.hatch.build.targets.wheel.sources]
"src/mlx_batch_server" = "mlx_batch_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'darwin'"]

[tool.uv.sources]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm.git", rev = "ab1806e8f5d6aa035973af194a1b9198ab4754dc" }
mlx-vlm = { git = "https://github.com/LibraxisAI/mlx-vlm.git", rev = "1068e53849364373680daaf8e71ef280b4fcc68d" }
mflux = { git = "https://github.com/plz12345/mflux.git", rev = "a9704fa1b0b8b58def97aed3bf14c1186ba18c66" }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "model: requires local model weights or optional inference dependencies",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:BPE.__init__:DeprecationWarning:transformers",
]

# === Ruff configuration (LibraxisAI) ===
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "ARG001", # unused function argument (common in FastAPI)
    "PLW0603", # global statement (singleton pattern)
    "TC003",  # type-checking block (runtime needed)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101", "PLC0415", "B017", "ERA001", "PLR0912", "PLR0915", "RUF002", "RUF003", "RUF012", "PTH100", "PTH110", "PTH118", "PTH120", "PTH123"]
"examples/*" = ["ERA", "ARG", "PLC0415", "SIM113", "SIM115", "B007", "PLR0912", "PTH123", "W291", "W293", "E402"]
"playground/*" = ["PLR0912", "PLR0915", "PLC0415", "SIM105"]  # Testing tool, complexity OK
"examples/**/*.ipynb" = ["ALL"]  # Notebooks are examples, not production code
# Lazy imports are intentional in these modules for performance
"src/mlx_batch_server/batch/coordinator.py" = ["PLC0415"]
"src/mlx_batch_server/batch/router.py" = ["PLC0415"]
"src/mlx_batch_server/chat/mlx/chat_generator.py" = ["PLC0415"]
"src/mlx_batch_server/chat/mlx/tools/llama3.py" = ["PLC0415"]
"src/mlx_batch_server/chat/mlx/tools/chat_template.py" = ["E402", "PLC0415", "PLR0912", "RUF003"]
"src/mlx_batch_server/chat/openai/openai_adapter.py" = ["PLC0415", "PLR0912"]
"src/mlx_batch_server/chat/openai/models/models.py" = ["PLC0415"]  # Lazy imports for wrapper_cache
# Complex parsing/conversion functions - refactoring would reduce readability
"src/mlx_batch_server/chat/mlx/tools/glm45_tools_parser.py" = ["PLR0911"]
"src/mlx_batch_server/chat/mlx/tools/qwen3_moe_tools_parser.py" = ["PLR0911"]
"src/mlx_batch_server/chat/anthropic/anthropic_messages_adapter.py" = ["PLR0912"]
"src/mlx_batch_server/responses/normalizer.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/responses/context_builder.py" = ["PLR0912"]  # Chain walking logic
"src/mlx_batch_server/embeddings/embeddings_service.py" = ["PLR0911", "UP038"]
# Union type annotations preserved for Pydantic compatibility in schemas
"src/mlx_batch_server/chat/anthropic/anthropic_schema.py" = ["UP007"]
"src/mlx_batch_server/chat/openai/schema.py" = ["UP007"]
# Legacy pathlib usage in upstream modules - preserved for compatibility
"src/mlx_batch_server/chat/openai/models/models_service.py" = ["PLC0415", "PTH123"]
"src/mlx_batch_server/batch/generator.py" = ["PLC0415"]
"src/mlx_batch_server/stt/whisper_model.py" = ["PTH106", "PTH108", "PTH110", "PTH118", "PTH123", "SIM108", "PLC0415"]
"src/mlx_batch_server/tts/tts_service.py" = ["PTH123", "PLC0415"]
"src/mlx_batch_server/images/images_service.py" = ["PTH108", "PTH123"]
"src/mlx_batch_server/images/schema.py" = ["ARG002"]
# Entry point - lazy imports for fast --help, compat import must be first
"src/mlx_batch_server/main.py" = ["PLC0415", "I001"]
# Auth surface - lazy redis/session imports keep optional deps optional
"src/mlx_batch_server/auth/api_keys.py" = ["PLC0415", "PLR0911"]
"src/mlx_batch_server/auth/hmac.py" = ["PLC0415"]
"src/mlx_batch_server/auth/session.py" = ["PLC0415"]
"src/mlx_batch_server/auth/rate_limit.py" = ["PLC0415", "PLR0912", "PLR0915"]
"src/mlx_batch_server/auth/dependency.py" = ["PLC0415", "PLR0912"]
"src/mlx_batch_server/auth/router_access.py" = ["PLC0415", "PLR0911"]
# Operator auth shim mirrors the multi-branch dependency surface
"src/mlx_batch_server/operator/auth.py" = ["PLR0912"]
"src/mlx_batch_server/health/ready.py" = ["PLC0415"]
"src/mlx_batch_server/routers.py" = ["PLC0415"]
# Canonical runtime state machines are intentionally explicit and branch-complete.
"src/mlx_batch_server/responses/projector.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/responses/runtime_mapper.py" = ["PLR0912"]
"src/mlx_batch_server/responses/runtime_projection.py" = ["PLR0912"]
"src/mlx_batch_server/responses/runtime_router.py" = ["PLR0911"]
"src/mlx_batch_server/responses/transport.py" = ["PLR0912", "PLR0915"]
"src/mlx_batch_server/runtime/backends/legacy_mlx.py" = ["PLR0912"]
"src/mlx_batch_server/runtime/backends/legacy_provider.py" = ["PLC0415", "PLR0911", "PLR0912"]
"src/mlx_batch_server/runtime/turn.py" = ["PLR0912"]
# Fusion code mirrors checkpoint and protocol branching; lazy imports preserve ABI isolation.
"src/mlx_batch_server/admin/router.py" = ["PLC0415"]
"src/mlx_batch_server/runtime/fusion/cache/lifecycle.py" = ["PLR0912"]
"src/mlx_batch_server/runtime/fusion/concrete/composition.py" = ["PLC0415"]
"src/mlx_batch_server/runtime/fusion/concrete/owner.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/runtime/fusion/concrete/provider.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/runtime/fusion/concrete/stepper.py" = ["PLR0912"]
"src/mlx_batch_server/runtime/fusion/mtp/policy.py" = ["PLR0911"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/model/config.py" = ["PLR0912"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/model/tensor.py" = ["PLC0415", "PLR0911", "PLR0912", "PLR0915"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/request_preparation.py" = ["PLR0912", "PLR0915"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/vision/mrope.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/vision/splice.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/runtime/fusion/qwen4_exp/vision/tensor_tower.py" = ["PLR0402"]  # Literal import is part of the frozen runtime provenance contract
"src/mlx_batch_server/tools/dialects/_common.py" = ["PLR0912"]
"src/mlx_batch_server/tools/dialects/qwen.py" = ["PLR0911", "PLR0912"]
"src/mlx_batch_server/tools/executor.py" = ["PLR0911"]
# Compat module - monkeypatch jieba to avoid pkg_resources deprecation
"src/mlx_batch_server/utils/compat.py" = ["PLC0415", "PLR0915", "PLR0402", "PTH120", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# === Bandit security configuration ===
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv"]
# B110 = try/except/pass — intentional in Redis/file best-effort fallback paths
skips = ["B101", "B104", "B110", "B311", "B605", "B607"]  # assert, 0.0.0.0, try/except/pass, random, os.system (jieba compat)

# === Mypy configuration ===
[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Too strict for dynamic FastAPI/Pydantic code
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "examples/", "build/"]
# Relax checks for Pydantic models with defaults
disable_error_code = ["call-arg", "assignment", "operator", "misc", "return"]

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mflux.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.responses.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "mlx_batch_server.runtime.fusion.qwen4_exp.model.tensor",
    "mlx_batch_server.runtime.fusion.qwen4_exp.vision.tensor_processing",
    "mlx_batch_server.runtime.fusion.qwen4_exp.vision.tensor_splice",
    "mlx_batch_server.runtime.fusion.qwen4_exp.vision.tensor_tower",
]
# These four modules are the strict MLX tensor ABI boundary. Runtime arrays,
# dynamic module trees, and quantized checkpoint payloads are not expressible
# through the upstream mlx/mlx-lm stubs; their contracts are covered by the
# focused tensor and model-load suites instead.
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.routing.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.chat.anthropic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.chat.mlx.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.chat.openai.models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.utils.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "mlx_batch_server.tts.*"
ignore_errors = true

