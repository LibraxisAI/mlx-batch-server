# .pre-commit-config.yaml
# Extended by LibraxisAI with ruff, semgrep, mypy, and loctree
repos:
  # Compile Embargo is an explicit W1 source-shape policy. The marker validator
  # fails closed before any deferrable hook, and the pre-push guard prevents an
  # embargo environment from weakening ref-boundary verification.
  - repo: local
    hooks:
      - id: compile-embargo-marker-policy
        name: Validate MLX Batch Compile Embargo marker
        entry: python3 scripts/quality/phase_gate.py --validate-marker
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: compile-embargo-ref-guard
        name: Reject Compile Embargo at the pre-push ref boundary
        entry: python3 scripts/quality/phase_gate.py --forbid-marker --surface pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-ast
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-toml

  # Ruff - ultra-fast Python linter & formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        entry: python3 scripts/quality/phase_gate.py --gate ruff -- ruff check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        entry: python3 scripts/quality/phase_gate.py --gate ruff-format -- ruff format

  # Mypy - static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        entry: python3 scripts/quality/phase_gate.py --gate mypy -- mypy
        additional_dependencies:
          - pydantic>=2.0
          - fastapi>=0.100
          - httpx>=0.25
          - types-redis
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^(tests/|examples/)

  # Bandit - Python security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        # pre-commit supplies the staged Python paths. The explicit recursive
        # src/ scan belongs to `make security`, not every bounded commit.
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: ^tests/

  # Loctree code quality checks - contributed by LibraxisAI (optional, warnings only)
  - repo: local
    hooks:
      - id: loctree-deadexports
        name: Check for dead exports
        entry: bash -c 'if command -v loct &>/dev/null; then loct deadexports || true; else echo "loct not installed, skipping"; fi'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true

      - id: loctree-twins
        name: Check for duplicate definitions
        entry: bash -c 'if command -v loct &>/dev/null; then loct twins || true; else echo "loct not installed, skipping"; fi'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true

  # Merge conflict markers — two-stage policy.
  # pre-commit: shout, but do not block. Salvage snapshots stay possible
  #             (e.g. bb194a8 intentionally landed a TODO before a refactor).
  # pre-push:   hard block. Garbage must not ride to origin.
  # Rationale: the stock check-merge-conflict only inspects STAGED files.
  # This repo-wide scan catches markers that already live in HEAD.
  - repo: local
    hooks:
      - id: merge-markers-warn
        name: Repo-wide merge marker guard (pre-commit, warn-only)
        entry: bash -c 'hits=$(git grep -nE "^(<<<<<<< |>>>>>>> |=======$)" -- ":(exclude).pre-commit-config.yaml" 2>/dev/null || true); if [ -n "$hits" ]; then printf "\n[warn] merge conflict markers still in tracked tree:\n%s\n[warn] commit allowed (salvage ok), but pre-push WILL block.\n" "$hits" >&2; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true

      - id: merge-markers-block
        name: Repo-wide merge marker guard (pre-push, blocking)
        entry: bash -c 'hits=$(git grep -nE "^(<<<<<<< |>>>>>>> |=======$)" -- ":(exclude).pre-commit-config.yaml" 2>/dev/null || true); if [ -n "$hits" ]; then printf "\nMerge conflict markers in tracked files:\n\n%s\n\nResolve them before pushing.\n" "$hits"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
