# .pre-commit-config.yaml
# Extended by LibraxisAI with ruff, semgrep, mypy, and loctree
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-ast
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-toml

  # Ruff - ultra-fast Python linter & formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy - static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - fastapi>=0.100
          - httpx>=0.25
          - types-redis
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^(tests/|examples/)

  # Bandit - Python security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'src/']
        additional_dependencies: ['bandit[toml]']
        exclude: ^tests/

  # Loctree code quality checks - contributed by LibraxisAI (optional, warnings only)
  - repo: local
    hooks:
      - id: loctree-deadexports
        name: Check for dead exports
        entry: bash -c 'if command -v loct &>/dev/null; then loct deadexports 2>/dev/null || true; else echo "loct not installed, skipping"; fi'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true

      - id: loctree-twins
        name: Check for duplicate definitions
        entry: bash -c 'if command -v loct &>/dev/null; then loct twins 2>/dev/null || true; else echo "loct not installed, skipping"; fi'
        language: system
        pass_filenames: false
        types: [python]
        verbose: true
