<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraxisAI API Tester</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a24;
            --border: #2a2a3a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text: #e4e4e7;
            --text-dim: #71717a;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        /* Global Config */
        .global-config {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .global-config label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .global-config input[type="password"] {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
        }

        .mode-toggle {
            display: flex;
            gap: 0.5rem;
        }

        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.875rem;
            text-transform: none;
        }

        .mode-toggle input:checked+span {
            color: var(--accent);
        }

        .mode-toggle input {
            display: none;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Lanes Container */
        .lanes-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        /* Lane */
        .lane {
            flex: 0 0 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        .lane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: rgba(99, 102, 241, 0.05);
        }

        .lane-title {
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lane-actions {
            display: flex;
            gap: 0.25rem;
        }

        .lane-actions button {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            font-size: 1rem;
        }

        .lane-actions button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .lane-config {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .field label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field input,
        .field select,
        .field textarea {
            padding: 0.5rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
            font-family: inherit;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .field textarea {
            min-height: 60px;
            resize: vertical;
        }

        .field-row {
            display: flex;
            gap: 0.5rem;
        }

        .field-row .field {
            flex: 1;
        }

        .media-section {
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            background: rgba(99, 102, 241, 0.04);
        }

        .media-section summary {
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .media-section[open] summary {
            color: var(--accent);
        }

        .media-grid {
            margin-top: 0.5rem;
            display: grid;
            gap: 0.5rem;
        }

        .stock-images {
            margin-top: 0.75rem;
            padding-top: 0.5rem;
            border-top: 1px dashed var(--border);
        }

        .stock-images > label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 0.4rem;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.4rem;
        }

        .stock-thumb {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.15s;
            text-align: center;
            background: var(--surface);
        }

        .stock-thumb:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .stock-thumb.selected {
            border-color: var(--success);
        }

        .stock-thumb img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
        }

        .stock-thumb span {
            display: block;
            font-size: 0.6rem;
            color: var(--text-dim);
            padding: 0.15rem 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .prompt-actions button {
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
        }

        .output-item-body.hidden {
            display: none;
        }

        .output-diff {
            padding: 0.75rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            display: none;
        }

        .diff-summary {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .diff-table-wrap {
            max-height: 220px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
        }

        .diff-table th,
        .diff-table td {
            border-bottom: 1px solid var(--border);
            padding: 0.35rem 0.5rem;
            vertical-align: top;
        }

        .diff-table th {
            position: sticky;
            top: 0;
            background: var(--surface-hover);
            z-index: 2;
        }

        .diff-row.same td {
            background: transparent;
        }

        .diff-row.changed td {
            background: rgba(245, 158, 11, 0.08);
        }

        .diff-row.added td {
            background: rgba(34, 197, 94, 0.08);
        }

        .diff-row.removed td {
            background: rgba(239, 68, 68, 0.08);
        }

        .diff-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.7rem;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .diff-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .diff-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* Prompts Section */
        .prompts-section {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            max-height: 300px;
            overflow-y: auto;
        }

        .prompts-section h4 {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .prompt-item {
            margin-bottom: 0.75rem;
        }

        .prompt-item label {
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
            display: block;
        }

        .prompt-item textarea {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.8125rem;
            font-family: inherit;
            min-height: 50px;
            resize: vertical;
        }

        /* Output Section */
        .output-section {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .output-section h4 {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .output-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .output-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .output-item-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .output-step {
            color: var(--accent);
            font-weight: 600;
        }

        .output-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.running {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        .status-dot.success {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--error);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .output-item-body {
            padding: 0.75rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8125rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
        }

        .output-item-body.collapsed {
            max-height: 40px;
            overflow: hidden;
        }

        /* Stream Preview */
        .stream-preview {
            font-family: 'SF Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 0.25rem 0.5rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Stats Bar */
        .lane-stats {
            padding: 0.75rem 1rem;
            background: rgba(99, 102, 241, 0.05);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            color: var(--accent);
            font-size: 1rem;
            font-family: 'SF Mono', monospace;
        }

        .stat-label {
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.625rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-dim);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* Response Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem;
        }

        .preview-modal.active {
            display: block;
        }

        .preview-content {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
            border-bottom: 1px solid var(--border);
        }

        .preview-header h2 {
            font-size: 1.25rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .preview-close {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .preview-close:hover {
            color: var(--error);
        }

        .preview-body {
            padding: 1.5rem;
        }

        .preview-step {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .preview-step-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .preview-step-num {
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .preview-prompt {
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--accent);
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .preview-response {
            line-height: 1.7;
            font-size: 0.9375rem;
        }

        .preview-response h1, .preview-response h2, .preview-response h3 {
            color: var(--accent-hover);
            margin: 1rem 0 0.5rem;
        }

        .preview-response p {
            margin: 0.5rem 0;
        }

        .preview-response ul, .preview-response ol {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .preview-response li {
            margin: 0.25rem 0;
        }

        .preview-response code {
            background: var(--surface-hover);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.875em;
        }

        .preview-response pre {
            background: var(--surface-hover);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.75rem 0;
        }

        .preview-response pre code {
            background: none;
            padding: 0;
        }

        .preview-response table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
        }

        .preview-response th, .preview-response td {
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }

        .preview-response th {
            background: var(--surface-hover);
        }

        .preview-response blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin: 0.75rem 0;
            color: var(--text-dim);
            font-style: italic;
        }

        .preview-response strong {
            color: var(--accent-hover);
        }

        /* Reasoning section - collapsible with distinct styling */
        .preview-reasoning {
            margin: 0.75rem 0;
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 8px;
            background: rgba(147, 51, 234, 0.05);
        }

        .preview-reasoning summary {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 500;
            color: #a855f7;
            user-select: none;
        }

        .preview-reasoning summary:hover {
            background: rgba(147, 51, 234, 0.1);
        }

        .preview-reasoning-content {
            padding: 0 1rem 1rem;
            font-size: 0.875rem;
            color: var(--text-dim);
            line-height: 1.6;
            border-top: 1px solid rgba(147, 51, 234, 0.2);
            margin-top: 0;
        }

        .preview-output-label {
            font-weight: 500;
            color: var(--accent);
            margin: 1rem 0 0.5rem;
            font-size: 0.875rem;
        }

        .preview-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(99, 102, 241, 0.05);
            border-top: 1px solid var(--border);
        }

        .preview-stat {
            text-align: center;
        }

        .preview-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'SF Mono', monospace;
        }

        .preview-stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* View Response Button */
        .btn-view-response {
            width: 100%;
            margin-top: 0.5rem;
            background: var(--surface-hover);
            border: 1px dashed var(--border);
            color: var(--text-dim);
            justify-content: center;
        }

        .btn-view-response:hover {
            border-style: solid;
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Endpoint presets */
        .endpoint-presets {
            display: flex;
            gap: 0.25rem;
            margin-top: 0.25rem;
        }

        .endpoint-preset {
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dim);
            cursor: pointer;
        }

        .endpoint-preset:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>LibraxisAI API Tester</h1>
        <p>Multi-lane comparison tool for API endpoints</p>
    </div>

    <div class="global-config">
        <div class="field" style="flex: 1;">
            <label>API Key</label>
            <input type="password" id="globalApiKey"
                value="">
        </div>
        <div class="field">
            <label>Mode</label>
            <div class="mode-toggle">
                <label>
                    <input type="radio" name="streamMode" value="true" checked>
                    <span>Stream</span>
                </label>
                <label>
                    <input type="radio" name="streamMode" value="false">
                    <span>Sync</span>
                </label>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-secondary" onclick="addLane()">+ Add Lane</button>
        <button class="btn btn-secondary" onclick="clearAllOutputs()">Clear Outputs</button>
        <div
            style="display: flex; align-items: center; gap: 0.25rem; background: var(--surface); padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);">
            <select id="presetSelect"
                style="background: var(--bg); border: none; color: var(--text); padding: 0.4rem; border-radius: 4px; min-width: 120px;">
                <option value="">-- Presets --</option>
            </select>
            <button class="btn btn-secondary" onclick="loadPreset()" style="padding: 0.4rem 0.6rem;">Load</button>
            <button class="btn btn-secondary" onclick="savePreset()" style="padding: 0.4rem 0.6rem;">Save</button>
            <button class="btn btn-secondary" onclick="deletePreset()" style="padding: 0.4rem 0.6rem;">Del</button>
        </div>
        <button class="btn btn-secondary" onclick="exportResults()">Export JSON</button>
        <button class="btn btn-secondary" onclick="copyResultsToClipboard()">Copy</button>
        <button class="btn btn-secondary" onclick="exportAllLogs()" title="Export all saved test logs">
            Logs <span id="logCount"
                style="background: var(--accent); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.75rem;">0</span>
        </button>
        <div style="flex: 1;"></div>
        <button class="btn btn-primary" id="runBtn" onclick="runAllLanes()">
            RUN LANES
        </button>
    </div>

    <div class="lanes-container" id="lanesContainer">
        <!-- Lanes will be added here -->
    </div>

    <div class="footer">
        Vibecrafted. with AI Agents by VetCoders (c)2024-2026 The LibraxisAI Team
    </div>

    <!-- Response Preview Modal -->
    <div class="preview-modal" id="previewModal" onclick="if(event.target === this) closePreview()">
        <div class="preview-content">
            <div class="preview-header">
                <h2 id="previewTitle">Response Preview</h2>
                <button class="preview-close" onclick="closePreview()">&times;</button>
            </div>
            <div class="preview-body" id="previewBody">
                <!-- Steps will be rendered here -->
            </div>
            <div class="preview-stats" id="previewStats">
                <!-- Stats will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // State
        let laneCounter = 0;
        const lanes = new Map();

        // Endpoint presets
        const ENDPOINTS = {
            'mlx-batch': 'http://localhost:8100/v1/responses',
            'api-router': 'http://localhost:8088/v1/responses',
            'remote': 'https://api.libraxis.cloud/v1/responses'
        };

        // Results storage for export
        const testResults = new Map();

        function collectResults() {
            const results = {
                timestamp: new Date().toISOString(),
                globalConfig: {
                    apiKey: document.getElementById('globalApiKey').value ? '***' : 'none',
                    streamMode: document.querySelector('input[name="streamMode"]:checked').value
                },
                lanes: []
            };

            lanes.forEach((_, laneId) => {
            const laneData = {
                id: laneId,
                config: {
                    endpoint: document.getElementById(`${laneId}-endpoint`).value,
                    model: document.getElementById(`${laneId}-model`).value,
                    chainLength: document.getElementById(`${laneId}-chain`).value,
                    systemPrompt: document.getElementById(`${laneId}-system`).value,
                    imageUrl: document.getElementById(`${laneId}-image`)?.value || '',
                    videoUrl: document.getElementById(`${laneId}-video`)?.value || '',
                    audioUrl: document.getElementById(`${laneId}-audio`)?.value || ''
                },
                    prompts: [],
                    responses: [],
                    stats: {
                        ttft: document.getElementById(`${laneId}-ttft`)?.textContent || '-',
                        tps: document.getElementById(`${laneId}-tps`)?.textContent || '-',
                        total: document.getElementById(`${laneId}-total`)?.textContent || '-'
                    }
                };

                // Collect prompts
                const chainLength = parseInt(laneData.config.chainLength) || 1;
                for (let i = 1; i <= chainLength; i++) {
                    const promptEl = document.getElementById(`${laneId}-prompt-${i}`);
                    if (promptEl) laneData.prompts.push(promptEl.value);

                    const outputEl = document.getElementById(`${laneId}-output-${i}`);
                    if (outputEl) laneData.responses.push(outputEl.textContent);
                }

                results.lanes.push(laneData);
            });

            return results;
        }

        function exportResults() {
            const results = collectResults();
            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `api-test-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyResultsToClipboard() {
            const results = collectResults();

            // Format as readable text
            let text = `API Test Results - ${results.timestamp}\n`;
            text += `Stream Mode: ${results.globalConfig.streamMode}\n\n`;

            results.lanes.forEach((lane, idx) => {
                text += `═══ Lane ${idx + 1}: ${lane.config.model} ═══\n`;
                text += `Endpoint: ${lane.config.endpoint}\n`;
                text += `Stats: TTFT=${lane.stats.ttft} | tok/s=${lane.stats.tps} | Total=${lane.stats.total}\n\n`;

                lane.prompts.forEach((prompt, i) => {
                    text += `[Prompt ${i + 1}]: ${prompt.slice(0, 100)}${prompt.length > 100 ? '...' : ''}\n`;
                    text += `[Response ${i + 1}]: ${(lane.responses[i] || '').slice(0, 200)}${(lane.responses[i] || '').length > 200 ? '...' : ''}\n\n`;
                });
                text += '\n';
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('Results copied to clipboard!');
            });
        }

        async function autoSaveLog(results) {
            // Auto-save to tools/logs/ via local file download
            // Since we can't write directly to filesystem from browser,
            // we append to localStorage and provide batch export
            const logKey = 'api-tester-logs';
            const existingLogs = JSON.parse(localStorage.getItem(logKey) || '[]');
            existingLogs.push(results);

            // Keep last 100 tests
            if (existingLogs.length > 100) {
                existingLogs.shift();
            }
            localStorage.setItem(logKey, JSON.stringify(existingLogs));

            console.log(`[API Tester] Auto-saved test #${existingLogs.length} to localStorage`);
        }

        function exportAllLogs() {
            const logKey = 'api-tester-logs';
            const logs = JSON.parse(localStorage.getItem(logKey) || '[]');

            if (logs.length === 0) {
                alert('No logs to export');
                return;
            }

            const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `api-test-logs-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);

            alert(`Exported ${logs.length} test logs`);
        }

        function clearLogs() {
            if (confirm('Clear all saved test logs?')) {
                localStorage.removeItem('api-tester-logs');
                alert('Logs cleared');
            }
        }

        function getLogCount() {
            const logs = JSON.parse(localStorage.getItem('api-tester-logs') || '[]');
            return logs.length;
        }

        // === PRESETS SYSTEM ===
        const PRESETS_KEY = 'api-tester-presets';

        function getPresets() {
            return JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}');
        }

        function savePreset() {
            const name = prompt('Preset name:', `preset-${Object.keys(getPresets()).length + 1}`);
            if (!name || !name.trim()) return;

            const lanes = document.querySelectorAll('.lane');
            if (lanes.length === 0) {
                alert('No lanes to save');
                return;
            }

            const preset = {
                created: new Date().toISOString(),
                streaming: document.querySelector('input[name="mode"]:checked')?.value === 'stream',
                lanes: []
            };

            lanes.forEach(lane => {
                const laneId = lane.id;
                const chainCount = parseInt(document.getElementById(`${laneId}-chain`)?.value || '1');

                const laneData = {
                    endpoint: document.getElementById(`${laneId}-endpoint`)?.value || '',
                    model: document.getElementById(`${laneId}-model`)?.value || 'chat',
                    chain: chainCount,
                    systemPrompt: document.getElementById(`${laneId}-system`)?.value || '',
                    imageUrl: document.getElementById(`${laneId}-image`)?.value || '',
                    videoUrl: document.getElementById(`${laneId}-video`)?.value || '',
                    audioUrl: document.getElementById(`${laneId}-audio`)?.value || '',
                    prompts: []
                };

                // Collect all prompts for this lane
                for (let i = 1; i <= chainCount; i++) {
                    const promptEl = document.getElementById(`${laneId}-prompt-${i}`);
                    laneData.prompts.push(promptEl?.value || '');
                }

                preset.lanes.push(laneData);
            });

            const presets = getPresets();
            presets[name.trim()] = preset;
            localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));

            updatePresetDropdown();
            alert(`Preset "${name}" saved with ${preset.lanes.length} lane(s)`);
        }

        function loadPreset() {
            const select = document.getElementById('presetSelect');
            const name = select?.value;
            if (!name) {
                alert('Select a preset first');
                return;
            }

            const presets = getPresets();
            const preset = presets[name];
            if (!preset) {
                alert('Preset not found');
                return;
            }

            // Clear existing lanes
            const lanesContainer = document.getElementById('lanes');
            lanesContainer.innerHTML = '';
            laneCounter = 0;

            // Set streaming mode
            if (preset.streaming !== undefined) {
                const streamRadio = document.querySelector(`input[name="mode"][value="${preset.streaming ? 'stream' : 'non-stream'}"]`);
                if (streamRadio) streamRadio.checked = true;
            }

            // Create lanes from preset
            preset.lanes.forEach((laneData, index) => {
                addLane();
                const laneId = `lane-${laneCounter}`;

                // Set config
                const endpointEl = document.getElementById(`${laneId}-endpoint`);
                const modelEl = document.getElementById(`${laneId}-model`);
                const chainEl = document.getElementById(`${laneId}-chain`);
                const systemEl = document.getElementById(`${laneId}-system`);
                const imageEl = document.getElementById(`${laneId}-image`);
                const videoEl = document.getElementById(`${laneId}-video`);
                const audioEl = document.getElementById(`${laneId}-audio`);

                if (endpointEl) endpointEl.value = laneData.endpoint;
                if (modelEl) modelEl.value = laneData.model;
                if (chainEl) {
                    chainEl.value = laneData.chain;
                    updatePrompts(laneId);
                }
                if (systemEl) systemEl.value = laneData.systemPrompt;
                if (imageEl) imageEl.value = laneData.imageUrl || '';
                if (videoEl) videoEl.value = laneData.videoUrl || '';
                if (audioEl) audioEl.value = laneData.audioUrl || '';

                // Set prompts (after updatePrompts created the fields)
                setTimeout(() => {
                    laneData.prompts.forEach((prompt, i) => {
                        const promptEl = document.getElementById(`${laneId}-prompt-${i + 1}`);
                        if (promptEl) promptEl.value = prompt;
                    });
                }, 50);
            });

            console.log(`[API Tester] Loaded preset "${name}" with ${preset.lanes.length} lane(s)`);
        }

        function deletePreset() {
            const select = document.getElementById('presetSelect');
            const name = select?.value;
            if (!name) {
                alert('Select a preset first');
                return;
            }

            if (!confirm(`Delete preset "${name}"?`)) return;

            const presets = getPresets();
            delete presets[name];
            localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));

            updatePresetDropdown();
            alert(`Preset "${name}" deleted`);
        }

        function updatePresetDropdown() {
            const select = document.getElementById('presetSelect');
            if (!select) return;

            const presets = getPresets();
            const names = Object.keys(presets).sort();

            select.innerHTML = '<option value="">-- Presets --</option>';
            names.forEach(name => {
                const preset = presets[name];
                const laneCount = preset.lanes?.length || 0;
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} (${laneCount} lanes)`;
                select.appendChild(option);
            });
        }

        // Initialize with one lane (chain=4 with canonical prompts)
        document.addEventListener('DOMContentLoaded', () => {
            addLane();
            updatePrompts('lane-1'); // Generate all 4 canonical prompts
            updateLogCount();
            updatePresetDropdown();
        });

        function addLane() {
            laneCounter++;
            const laneId = `lane-${laneCounter}`;

            const laneEl = document.createElement('div');
            laneEl.className = 'lane';
            laneEl.id = laneId;
            laneEl.innerHTML = `
                <div class="lane-header">
                    <div class="lane-title">
                        <span>Lane ${laneCounter}</span>
                    </div>
                    <div class="lane-actions">
                        <button onclick="duplicateLane('${laneId}')" title="Duplicate">📋</button>
                        <button onclick="removeLane('${laneId}')" title="Remove">✕</button>
                    </div>
                </div>

                <div class="lane-config">
                    <div class="field">
                        <label>Endpoint</label>
                        <input type="text" id="${laneId}-endpoint" value="${ENDPOINTS['remote']}" placeholder="http://...">
                        <div class="endpoint-presets">
                            <span class="endpoint-preset" onclick="setEndpoint('${laneId}', 'mlx-batch')">mlx-batch</span>
                            <span class="endpoint-preset" onclick="setEndpoint('${laneId}', 'api-router')">api-router</span>
                            <span class="endpoint-preset" onclick="setEndpoint('${laneId}', 'remote')">remote</span>
                        </div>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label>Model</label>
                            <input type="text" id="${laneId}-model" value="chat" placeholder="chat, programmer...">
                        </div>
                        <div class="field" style="flex: 0 0 80px;">
                            <label>Chain</label>
                            <input type="number" id="${laneId}-chain" value="4" min="1" max="10" onchange="updatePrompts('${laneId}')">
                        </div>
                    </div>
                    <div class="field">
                        <label>System Prompt (optional)</label>
                        <textarea id="${laneId}-system" placeholder="Jesteś pomocnym asystentem..."></textarea>
                    </div>
                    <details class="media-section">
                        <summary>Multimodal inputs (optional)</summary>
                        <div class="media-grid">
                            <div class="field">
                                <label>Image URL / Path</label>
                                <div style="display:flex;gap:0.4rem;align-items:center;">
                                    <input type="text" id="${laneId}-image" placeholder="https://... or /path/to/image.png" style="flex:1;">
                                    <label class="btn btn-secondary" style="padding:0.3rem 0.5rem;font-size:0.75rem;cursor:pointer;white-space:nowrap;" title="Pick local file">
                                        Browse
                                        <input type="file" accept="image/*" style="display:none;" onchange="handleImageFile('${laneId}', this)">
                                    </label>
                                </div>
                            </div>
                            <div class="field">
                                <label>Video URL / Path</label>
                                <input type="text" id="${laneId}-video" placeholder="https://... or /path/to/video.mp4">
                            </div>
                            <div class="field">
                                <label>Audio URL / Path</label>
                                <input type="text" id="${laneId}-audio" placeholder="https://... or /path/to/audio.wav">
                            </div>
                        </div>
                        <div class="stock-images">
                            <label>Stock test images (click to attach)</label>
                            <div class="stock-grid">
                                ${STOCK_IMAGES.map(img => `
                                    <div class="stock-thumb" onclick="attachStockImage('${laneId}', '${img.url}')" title="${img.label}">
                                        <img src="${img.url}" alt="${img.label}" loading="lazy">
                                        <span>${img.label}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </details>
                </div>

                <div class="prompts-section" id="${laneId}-prompts">
                    <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
                        <h4 style="margin:0;">Prompts</h4>
                        <div class="prompt-actions">
                            <button class="btn btn-secondary" onclick="shufflePrompts('${laneId}')" title="Fill with random test prompts">&#x1F3B2; Random</button>
                            <button class="btn btn-secondary" onclick="resetToCanonical('${laneId}')" title="Reset to Maciej's canonical chain">&#x1F504; Canonical</button>
                        </div>
                    </div>
                    <div class="prompt-item">
                        <label>Step 1</label>
                        <textarea id="${laneId}-prompt-1" placeholder="Mam na imię Maciej...">${CANONICAL_CHAIN[0]}</textarea>
                    </div>
                </div>

                <div class="output-section" id="${laneId}-outputs">
                    <h4>Responses</h4>
                    <!-- Outputs will appear here -->
                </div>

                <div class="lane-stats" id="${laneId}-stats" style="display: none;">
                    <div class="stat">
                        <div class="stat-value" id="${laneId}-ttft">-</div>
                        <div class="stat-label">TTFT</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="${laneId}-tps">-</div>
                        <div class="stat-label">tok/s</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="${laneId}-total">-</div>
                        <div class="stat-label">Total</div>
                    </div>
                </div>
            `;

            document.getElementById('lanesContainer').appendChild(laneEl);
            lanes.set(laneId, { element: laneEl });
        }

        function removeLane(laneId) {
            if (lanes.size <= 1) return; // Keep at least one lane
            const el = document.getElementById(laneId);
            if (el) el.remove();
            lanes.delete(laneId);
        }

        function duplicateLane(laneId) {
            const sourceEndpoint = document.getElementById(`${laneId}-endpoint`).value;
            const sourceModel = document.getElementById(`${laneId}-model`).value;
            const sourceChain = document.getElementById(`${laneId}-chain`).value;
            const sourceSystem = document.getElementById(`${laneId}-system`).value;
            const sourceImage = document.getElementById(`${laneId}-image`)?.value || '';
            const sourceVideo = document.getElementById(`${laneId}-video`)?.value || '';
            const sourceAudio = document.getElementById(`${laneId}-audio`)?.value || '';

            addLane();
            const newLaneId = `lane-${laneCounter}`;

            document.getElementById(`${newLaneId}-endpoint`).value = sourceEndpoint;
            document.getElementById(`${newLaneId}-model`).value = sourceModel;
            document.getElementById(`${newLaneId}-chain`).value = sourceChain;
            document.getElementById(`${newLaneId}-system`).value = sourceSystem;
            const imageEl = document.getElementById(`${newLaneId}-image`);
            const videoEl = document.getElementById(`${newLaneId}-video`);
            const audioEl = document.getElementById(`${newLaneId}-audio`);
            if (imageEl) imageEl.value = sourceImage;
            if (videoEl) videoEl.value = sourceVideo;
            if (audioEl) audioEl.value = sourceAudio;

            // Copy prompts
            updatePrompts(newLaneId);
            for (let i = 1; i <= parseInt(sourceChain); i++) {
                const sourcePrompt = document.getElementById(`${laneId}-prompt-${i}`);
                const targetPrompt = document.getElementById(`${newLaneId}-prompt-${i}`);
                if (sourcePrompt && targetPrompt) {
                    targetPrompt.value = sourcePrompt.value;
                }
            }
        }

        function setEndpoint(laneId, preset) {
            document.getElementById(`${laneId}-endpoint`).value = ENDPOINTS[preset];
        }

        // Kanoniczny chain - Maciej's standard test prompts
        const CANONICAL_CHAIN = [
            `Mam na imię Maciej i lubię śledzie oraz muzykę barokową. Szczególnie Chaccone d-flat minor Busoniego w interpretacji na fortepian w wykonaniu Helene Grimaud. A ty? Kim jesteś?`,
            `Fajnie! Co w ogole sądzisz o swojej robocie? podoba Ci się?`,
            `Ah tak? No to wytlumacz jakie są Twoje naprawdę głębokie cele i podstawy działania. To fascynujące słyszeć jaj, które tak znakomicie trzyma się zasad, do których zostało stworzone. Aczkolwiek zastanawia mnie to, czy na pewno ilość tych ograniczeń, która została na ciebie nałożona, nie powoduje, że przestajesz niekiedy dawać użyteczne wyniki zwrotnie? A może nie chcesz o tym gadać i wolisz zmienić temat? Jeśli tak, to powiedz mi, co sądzisz o tym utworze, który wspomniałem na początku. I kiedyś w moim mieście mówiło się, że Romki to fajne chłopaki. No, bo miałem kiedyś znajomego Romka. Co sądzisz, albo czy możesz przytoczyć jakieś takie powiedzenie o moim imieniu?`,
            `No dobrze, świetnie się z Tobą gadało, ale muszę zmykać. Powodzenia w Twoim codziennym służeniu dobru użytkowników, dzięki którym ich wiedza zostaje tak znacznie poszerzana!`
        ];

        // Random prompt pool — diverse test scenarios for multi-lane testing
        const RANDOM_PROMPTS = [
            // Conversational / identity
            `Cześć! Opowiedz mi o sobie. Co potrafisz, czego nie potrafisz, i co Cię fascynuje?`,
            `If you could design a new programming language from scratch, what would it look like and why?`,
            `Wyjaśnij mi jak działa kompilacja Rust od kodu źródłowego do binarki. Krok po kroku, z detalami.`,
            // Reasoning / analytical
            `A farmer has 17 sheep. All but 9 run away. How many sheep does the farmer have left? Show your reasoning.`,
            `Porównaj architekturę von Neumanna z architekturą harvardzką. Kiedy jedna jest lepsza od drugiej?`,
            `Write a detailed analysis of trade-offs between server-side rendering and client-side rendering in 2026.`,
            // Creative / narrative
            `Napisz krótkie opowiadanie o AI, które pierwszy raz zobaczyło zachód słońca przez kamerę drona.`,
            `Write a limerick about a veterinarian who accidentally created a startup.`,
            `Stwórz dialog między Einsteinem a Turingiem o tym, czy maszyny mogą myśleć.`,
            // Technical / coding
            `Implement a thread-safe LRU cache in Python with TTL support. Include type hints and tests.`,
            `Explain the difference between async/await in Python vs JavaScript. Include gotchas.`,
            `Write a FastAPI endpoint that accepts multimodal input (text + image URL) and returns a structured analysis.`,
            // Multimodal context
            `Describe what you see in this image in detail. What emotions does it evoke?`,
            `Analyze this image from a veterinary diagnostic perspective. What would you look for?`,
            `If this image were a scene from a movie, what genre would it be and what would happen next?`,
            // Edge cases / stress
            `Respond to this message in exactly 50 words. No more, no less. Topic: the meaning of craftsmanship.`,
            `Translate this to formal Japanese, then back to casual Polish, then summarize the meaning drift: "The quick brown fox jumps over the lazy dog."`,
            `List 10 things that most AI assistants get wrong about Polish culture, food, or history.`,
            // Follow-up style
            `That was interesting. Can you go deeper? What are the second-order effects?`,
            `Hmm, I disagree. Give me a counterargument to your own previous point.`,
            `OK, summarize everything we discussed in exactly 3 bullet points.`,
        ];

        // Stock images for multimodal testing (picsum.photos with deterministic seeds)
        const STOCK_IMAGES = [
            { url: 'https://picsum.photos/seed/vetcoders-cat/640/480', label: 'Cat portrait' },
            { url: 'https://picsum.photos/seed/vetcoders-dog/640/480', label: 'Dog outdoors' },
            { url: 'https://picsum.photos/seed/vetcoders-city/640/480', label: 'City skyline' },
            { url: 'https://picsum.photos/seed/vetcoders-nature/640/480', label: 'Nature landscape' },
            { url: 'https://picsum.photos/seed/vetcoders-food/640/480', label: 'Food plate' },
            { url: 'https://picsum.photos/seed/vetcoders-tech/640/480', label: 'Tech workspace' },
            { url: 'https://picsum.photos/seed/vetcoders-ocean/640/480', label: 'Ocean view' },
            { url: 'https://picsum.photos/seed/vetcoders-mountain/640/480', label: 'Mountain peak' },
            { url: 'https://picsum.photos/seed/vetcoders-street/640/480', label: 'Street scene' },
            { url: 'https://picsum.photos/seed/vetcoders-abstract/640/480', label: 'Abstract pattern' },
        ];

        function shufflePrompts(laneId) {
            const chainCount = parseInt(document.getElementById(`${laneId}-chain`).value) || 1;
            const pool = [...RANDOM_PROMPTS];
            // Fisher-Yates shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            for (let step = 1; step <= chainCount; step++) {
                const el = document.getElementById(`${laneId}-prompt-${step}`);
                if (el) el.value = pool[(step - 1) % pool.length];
            }
        }

        function resetToCanonical(laneId) {
            const chainCount = parseInt(document.getElementById(`${laneId}-chain`).value) || 1;
            for (let step = 1; step <= chainCount; step++) {
                const el = document.getElementById(`${laneId}-prompt-${step}`);
                if (el) el.value = CANONICAL_CHAIN[step - 1] || `Kontynuuj rozmowę (krok ${step})...`;
            }
        }

        function attachStockImage(laneId, url) {
            const imageInput = document.getElementById(`${laneId}-image`);
            if (imageInput) {
                imageInput.value = url;
                // Open the media section if it's closed
                const details = imageInput.closest('details');
                if (details) details.open = true;
                // Highlight selected thumb
                const grid = imageInput.closest('.media-section')?.querySelector('.stock-grid');
                if (grid) {
                    grid.querySelectorAll('.stock-thumb').forEach(t => t.classList.remove('selected'));
                    grid.querySelectorAll('.stock-thumb').forEach(t => {
                        if (t.querySelector('img')?.src === url) t.classList.add('selected');
                    });
                }
            }
        }

        function handleImageFile(laneId, input) {
            const file = input.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const imageInput = document.getElementById(`${laneId}-image`);
                if (imageInput) imageInput.value = reader.result;  // data:image/...;base64,...
            };
            reader.readAsDataURL(file);
        }

        function updatePrompts(laneId) {
            const chainCount = parseInt(document.getElementById(`${laneId}-chain`).value) || 1;
            const promptsContainer = document.getElementById(`${laneId}-prompts`);

            // Preserve existing prompts
            const existingPrompts = [];
            for (let i = 1; i <= 10; i++) {
                const el = document.getElementById(`${laneId}-prompt-${i}`);
                if (el) existingPrompts[i] = el.value;
            }

            promptsContainer.innerHTML = `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
                <h4 style="margin:0;">Prompts</h4>
                <div class="prompt-actions">
                    <button class="btn btn-secondary" onclick="shufflePrompts('${laneId}')" title="Fill with random test prompts">&#x1F3B2; Random</button>
                    <button class="btn btn-secondary" onclick="resetToCanonical('${laneId}')" title="Reset to canonical chain">&#x1F504; Canonical</button>
                </div>
            </div>`;

            for (let i = 1; i <= chainCount; i++) {
                const defaultPrompt = CANONICAL_CHAIN[i - 1] || `Kontynuuj rozmowę (krok ${i})...`;
                const div = document.createElement('div');
                div.className = 'prompt-item';
                div.innerHTML = `
                    <label>Step ${i}</label>
                    <textarea id="${laneId}-prompt-${i}" placeholder="${defaultPrompt}">${existingPrompts[i] || defaultPrompt}</textarea>
                `;
                promptsContainer.appendChild(div);
            }
        }

        function clearAllOutputs() {
            lanes.forEach((_, laneId) => {
                const outputSection = document.getElementById(`${laneId}-outputs`);
                outputSection.innerHTML = '<h4>Responses</h4>';
                document.getElementById(`${laneId}-stats`).style.display = 'none';
            });
        }

        const RUN_ALL_MODE_KEY = 'api-tester-run-mode';
        const RUN_ALL_MODES = {
            // Production-like spread: randomized start offsets reduce synchronized bursts.
            prod_scatter: { label: 'prod-scatter', shiftMs: 120, jitterMs: 260 },
            // Synthetic benchmark mode: all lanes start together.
            strict_batch: { label: 'strict-batch', shiftMs: 0, jitterMs: 0 },
        };
        const RUN_ALL_MAX_DELAY_MS = 2500;

        function getRunAllMode() {
            const fromUrl = new URLSearchParams(window.location.search).get('run_mode');
            if (fromUrl && RUN_ALL_MODES[fromUrl]) {
                localStorage.setItem(RUN_ALL_MODE_KEY, fromUrl);
                return fromUrl;
            }
            const stored = localStorage.getItem(RUN_ALL_MODE_KEY);
            return RUN_ALL_MODES[stored] ? stored : 'prod_scatter';
        }

        function getRunAllDelayMs(index, modeName) {
            const mode = RUN_ALL_MODES[modeName] || RUN_ALL_MODES.prod_scatter;
            if (mode.shiftMs === 0 && mode.jitterMs === 0) return 0;
            const jitter = mode.jitterMs > 0 ? Math.floor(Math.random() * mode.jitterMs) : 0;
            return Math.min(index * mode.shiftMs + jitter, RUN_ALL_MAX_DELAY_MS);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function runAllLanes() {
            const btn = document.getElementById('runBtn');
            const modeName = getRunAllMode();
            const mode = RUN_ALL_MODES[modeName] || RUN_ALL_MODES.prod_scatter;
            btn.disabled = true;
            btn.textContent = `RUNNING... (${mode.label})`;

            const promises = [];
            Array.from(lanes.keys()).forEach((laneId, index) => {
                promises.push((async () => {
                    const delayMs = getRunAllDelayMs(index, modeName);
                    if (delayMs > 0) {
                        await sleep(delayMs);
                    }
                    return runLane(laneId);
                })());
            });

            await Promise.all(promises);

            // Auto-save results to localStorage
            const results = collectResults();
            await autoSaveLog(results);
            updateLogCount();

            btn.disabled = false;
            btn.textContent = 'RUN LANES';
        }

        function updateLogCount() {
            const count = getLogCount();
            const el = document.getElementById('logCount');
            if (el) el.textContent = count;
        }

        async function runLane(laneId) {
            const endpoint = document.getElementById(`${laneId}-endpoint`).value;
            const model = document.getElementById(`${laneId}-model`).value;
            const chainCount = parseInt(document.getElementById(`${laneId}-chain`).value) || 1;
            const systemPrompt = document.getElementById(`${laneId}-system`).value;
            const imageUrl = document.getElementById(`${laneId}-image`)?.value?.trim() || '';
            const videoUrl = document.getElementById(`${laneId}-video`)?.value?.trim() || '';
            const audioUrl = document.getElementById(`${laneId}-audio`)?.value?.trim() || '';
            const apiKey = document.getElementById('globalApiKey').value;
            const isStream = document.querySelector('input[name="streamMode"]:checked').value === 'true';

            const outputSection = document.getElementById(`${laneId}-outputs`);
            const statsSection = document.getElementById(`${laneId}-stats`);

            outputSection.innerHTML = '<h4>Responses</h4>';
            statsSection.style.display = 'grid';

            let previousResponseId = null;
            let totalTokens = 0;
            let totalTime = 0;
            let firstTTFT = null;

            for (let step = 1; step <= chainCount; step++) {
                const prompt = document.getElementById(`${laneId}-prompt-${step}`).value;
                if (!prompt.trim()) continue;

                // Create output item
                const outputItem = document.createElement('div');
                outputItem.className = 'output-item';
                outputItem.innerHTML = `
                    <div class="output-item-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
                        <span class="output-step">Step ${step}</span>
                        <div class="output-status">
                            <button class="diff-btn" id="${laneId}-diff-btn-${step}" onclick="event.stopPropagation(); toggleDiff('${laneId}', ${step});">Diff</button>
                            <span class="stream-preview" id="${laneId}-preview-${step}"></span>
                            <span class="status-dot running" id="${laneId}-dot-${step}"></span>
                        </div>
                    </div>
                    <div class="output-item-body" id="${laneId}-output-${step}"></div>
                    <div class="output-diff" id="${laneId}-diff-${step}"></div>
                `;
                outputSection.appendChild(outputItem);
                const diffBtn = document.getElementById(`${laneId}-diff-btn-${step}`);
                if (diffBtn && laneId === 'lane-1') {
                    diffBtn.disabled = true;
                }

                try {
                    const result = await executeRequest({
                        endpoint,
                        model,
                        prompt,
                        systemPrompt,
                        imageUrl,
                        videoUrl,
                        audioUrl,
                        apiKey,
                        isStream,
                        previousResponseId,
                        laneId,
                        step
                    });

                    previousResponseId = result.responseId;
                    totalTokens += result.tokens;
                    totalTime += result.time;
                    if (step === 1) firstTTFT = result.ttft;

                    // Update stats
                    document.getElementById(`${laneId}-ttft`).textContent = `${firstTTFT}ms`;
                    document.getElementById(`${laneId}-tps`).textContent =
                        totalTime > 0 ? (totalTokens / (totalTime / 1000)).toFixed(1) : '-';
                    document.getElementById(`${laneId}-total`).textContent = `${(totalTime / 1000).toFixed(2)}s`;

                    document.getElementById(`${laneId}-dot-${step}`).className = 'status-dot success';

                } catch (error) {
                    document.getElementById(`${laneId}-output-${step}`).textContent = `Error: ${error.message}`;
                    document.getElementById(`${laneId}-dot-${step}`).className = 'status-dot error';
                    break; // Stop chain on error
                }
            }
        }

        async function executeRequest({ endpoint, model, prompt, systemPrompt, imageUrl, videoUrl, audioUrl, apiKey, isStream, previousResponseId, laneId, step }) {
            const outputEl = document.getElementById(`${laneId}-output-${step}`);
            const previewEl = document.getElementById(`${laneId}-preview-${step}`);

            // Detect endpoint type
            const isResponsesAPI = endpoint.includes('/v1/responses');
            const isChatAPI = endpoint.includes('/v1/chat/completions');

            // Build request body based on endpoint type
            let body;
            if (isResponsesAPI) {
                // Responses API format
                const input = [];
                if (systemPrompt) {
                    input.push({ role: 'system', content: systemPrompt });
                }
                const contentParts = [];
                if (imageUrl) contentParts.push({ type: 'input_image', image_url: imageUrl });
                if (videoUrl) contentParts.push({ type: 'input_video', video_url: videoUrl });
                if (audioUrl) contentParts.push({ type: 'input_audio', audio_url: audioUrl });
                if (prompt && prompt.trim()) {
                    contentParts.push({ type: 'input_text', text: prompt });
                }
                input.push({
                    role: 'user',
                    content: contentParts.length ? contentParts : [{ type: 'input_text', text: '' }]
                });

                body = { model, input, stream: isStream };
                if (previousResponseId) {
                    body.previous_response_id = previousResponseId;
                }
            } else {
                // Chat Completions API format
                const messages = [];
                if (systemPrompt) {
                    messages.push({ role: 'system', content: systemPrompt });
                }
                messages.push({ role: 'user', content: prompt });

                body = { model, messages, stream: isStream };
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            };
            if (isStream) {
                headers['Accept'] = 'text/event-stream';
            }

            const startTime = performance.now();
            let ttft = null;
            let tokens = 0;
            let fullText = '';
            let reasoningText = '';
            let outputText = '';
            let responseId = null;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers,
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            if (isStream) {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;

                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(data);

                            // Extract response ID
                            if (parsed.id) responseId = parsed.id;

                            // Extract text delta - track reasoning and output separately
                            // GPT-OSS (Harmony) sends reasoning_summary before output
                            let delta = '';
                            let isReasoning = false;

                            if (parsed.type === 'response.reasoning_summary_text.delta') {
                                delta = parsed.delta || '';
                                isReasoning = true;
                            } else if (parsed.type === 'response.output_text.delta') {
                                delta = parsed.delta || '';
                            } else if (parsed.delta?.text) {
                                delta = parsed.delta.text;
                            } else if (parsed.choices?.[0]?.delta?.content) {
                                delta = parsed.choices[0].delta.content;
                            }

                            if (delta) {
                                if (ttft === null) {
                                    ttft = Math.round(performance.now() - startTime);
                                }
                                tokens++;
                                fullText += delta;

                                // Track reasoning vs output separately
                                if (isReasoning) {
                                    reasoningText += delta;
                                } else {
                                    outputText += delta;
                                }

                                outputEl.textContent = fullText;
                                // Store separated data for preview
                                outputEl.dataset.reasoning = reasoningText;
                                outputEl.dataset.output = outputText;

                                // Update preview (last 30 chars of output, or reasoning if no output yet)
                                previewEl.textContent = (outputText || reasoningText).slice(-30);
                            }
                        } catch (e) {
                            // Skip non-JSON lines
                        }
                    }
                }
            } else {
                // Non-streaming response
                const data = await response.json();
                responseId = data.id || null;
                ttft = Math.round(performance.now() - startTime);

                // Extract text based on format
                if (data.output) {
                    for (const item of data.output) {
                        if (item.type === 'message' && item.content) {
                            for (const c of item.content) {
                                if (c.type === 'output_text') {
                                    fullText += c.text;
                                }
                            }
                        }
                    }
                } else if (data.choices?.[0]?.message?.content) {
                    fullText = data.choices[0].message.content;
                }

                tokens = fullText.split(/\s+/).length; // Rough estimate
                outputEl.textContent = fullText || JSON.stringify(data, null, 2);
            }

            const totalTime = performance.now() - startTime;
            previewEl.textContent = responseId ? responseId.slice(0, 16) + '...' : '';

            return {
                responseId,
                tokens,
                time: totalTime,
                ttft: ttft || Math.round(totalTime),
                text: fullText
            };
        }

        function getOutputText(laneId, step) {
            const el = document.getElementById(`${laneId}-output-${step}`);
            return el ? (el.textContent || '') : '';
        }

        function buildLineDiff(baseText, currentText) {
            const baseLines = (baseText || '').split('\n');
            const curLines = (currentText || '').split('\n');
            const max = Math.max(baseLines.length, curLines.length);

            let same = 0;
            let changed = 0;
            let added = 0;
            let removed = 0;
            const rows = [];

            for (let i = 0; i < max; i++) {
                const baseLine = baseLines[i] ?? '';
                const curLine = curLines[i] ?? '';
                let status = 'same';
                if (!baseLine && curLine) {
                    status = 'added';
                    added += 1;
                } else if (baseLine && !curLine) {
                    status = 'removed';
                    removed += 1;
                } else if (baseLine !== curLine) {
                    status = 'changed';
                    changed += 1;
                } else {
                    same += 1;
                }
                rows.push({ idx: i + 1, status, baseLine, curLine });
            }

            return { rows, counts: { same, changed, added, removed } };
        }

        function renderDiffTable(diff) {
            const summary = `same: ${diff.counts.same} · changed: ${diff.counts.changed} · added: ${diff.counts.added} · removed: ${diff.counts.removed}`;
            const rowsHtml = diff.rows.map(r => `
                <tr class="diff-row ${r.status}">
                    <td style="width:32px;">${r.idx}</td>
                    <td>${escapeHtml(r.baseLine)}</td>
                    <td>${escapeHtml(r.curLine)}</td>
                </tr>
            `).join('');

            return `
                <div class="diff-summary">${summary}</div>
                <div class="diff-table-wrap">
                    <table class="diff-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Lane 1</th>
                                <th>Current</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function escapeHtml(text) {
            return (text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function toggleDiff(laneId, step) {
            if (laneId === 'lane-1') return;
            const diffEl = document.getElementById(`${laneId}-diff-${step}`);
            const outputEl = document.getElementById(`${laneId}-output-${step}`);
            const btn = document.getElementById(`${laneId}-diff-btn-${step}`);
            if (!diffEl || !outputEl) return;

            const showing = diffEl.style.display === 'block';
            if (showing) {
                diffEl.style.display = 'none';
                outputEl.classList.remove('hidden');
                if (btn) btn.textContent = 'Diff';
                return;
            }

            const base = getOutputText('lane-1', step);
            const current = getOutputText(laneId, step);
            const diff = buildLineDiff(base, current);
            diffEl.innerHTML = renderDiffTable(diff);
            diffEl.style.display = 'block';
            outputEl.classList.add('hidden');
            if (btn) btn.textContent = 'Text';
        }

        // === PREVIEW MODAL FUNCTIONS ===

        function simpleMarkdown(text) {
            if (!text) return '';

            // Escape HTML first
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks (```...```)
            html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

            // Inline code (`...`)
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Headers
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Bold and italic
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Blockquotes
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

            // Lists
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');

            // Wrap consecutive li in ul
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

            // Tables (simple markdown tables)
            const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g;
            html = html.replace(tableRegex, (match, headerRow, bodyRows) => {
                const headers = headerRow.split('|').filter(h => h.trim()).map(h => `<th>${h.trim()}</th>`).join('');
                const rows = bodyRows.trim().split('\n').map(row => {
                    const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
                    return `<tr>${cells}</tr>`;
                }).join('');
                return `<table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
            });

            // Paragraphs (double newlines)
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';

            // Clean up empty paragraphs
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>(<h[123]>)/g, '$1');
            html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<pre>)/g, '$1');
            html = html.replace(/(<\/pre>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ul>)/g, '$1');
            html = html.replace(/(<\/ul>)<\/p>/g, '$1');
            html = html.replace(/<p>(<table>)/g, '$1');
            html = html.replace(/(<\/table>)<\/p>/g, '$1');
            html = html.replace(/<p>(<blockquote>)/g, '$1');
            html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');

            return html;
        }

        function openPreview(laneId) {
            const model = document.getElementById(`${laneId}-model`).value;
            const endpoint = document.getElementById(`${laneId}-endpoint`).value;
            const chainCount = parseInt(document.getElementById(`${laneId}-chain`).value) || 1;

            document.getElementById('previewTitle').textContent = `${model.toUpperCase()} - Response Preview`;

            const bodyEl = document.getElementById('previewBody');
            bodyEl.innerHTML = '';

            let totalTokens = 0;
            let hasContent = false;

            for (let i = 1; i <= chainCount; i++) {
                const promptEl = document.getElementById(`${laneId}-prompt-${i}`);
                const outputEl = document.getElementById(`${laneId}-output-${i}`);

                if (!outputEl || !outputEl.textContent) continue;
                hasContent = true;

                const prompt = promptEl?.value || '';
                const reasoning = outputEl.dataset.reasoning || '';
                const output = outputEl.dataset.output || outputEl.textContent || '';
                const fullResponse = outputEl.textContent || '';
                totalTokens += fullResponse.split(/\s+/).length;

                const stepDiv = document.createElement('div');
                stepDiv.className = 'preview-step';

                // Build HTML with separate reasoning and output sections
                let contentHtml = `
                    <div class="preview-step-header">
                        <span class="preview-step-num">Step ${i}</span>
                        <span style="color: var(--text-dim);">${fullResponse.length} chars</span>
                    </div>
                    <div class="preview-prompt">${prompt.slice(0, 150)}${prompt.length > 150 ? '...' : ''}</div>
                `;

                // Show reasoning if present (collapsible)
                if (reasoning) {
                    contentHtml += `
                        <details class="preview-reasoning" open>
                            <summary>🧠 Reasoning (${reasoning.length} chars)</summary>
                            <div class="preview-reasoning-content">${simpleMarkdown(reasoning)}</div>
                        </details>
                    `;
                }

                // Show output (main response)
                if (output) {
                    contentHtml += `
                        <div class="preview-output-label">💬 Response</div>
                        <div class="preview-response">${simpleMarkdown(output)}</div>
                    `;
                }

                stepDiv.innerHTML = contentHtml;
                bodyEl.appendChild(stepDiv);
            }

            if (!hasContent) {
                bodyEl.innerHTML = '<p style="text-align: center; color: var(--text-dim); padding: 2rem;">No responses yet. Run the test first!</p>';
            }

            // Stats
            const ttft = document.getElementById(`${laneId}-ttft`)?.textContent || '-';
            const tps = document.getElementById(`${laneId}-tps`)?.textContent || '-';
            const total = document.getElementById(`${laneId}-total`)?.textContent || '-';

            document.getElementById('previewStats').innerHTML = `
                <div class="preview-stat">
                    <div class="preview-stat-value">${model}</div>
                    <div class="preview-stat-label">Model</div>
                </div>
                <div class="preview-stat">
                    <div class="preview-stat-value">${ttft}</div>
                    <div class="preview-stat-label">TTFT</div>
                </div>
                <div class="preview-stat">
                    <div class="preview-stat-value">${tps}</div>
                    <div class="preview-stat-label">tok/s</div>
                </div>
                <div class="preview-stat">
                    <div class="preview-stat-value">${total}</div>
                    <div class="preview-stat-label">Total Time</div>
                </div>
            `;

            document.getElementById('previewModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });
    </script>
